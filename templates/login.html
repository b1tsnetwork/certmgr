{{define "content"}}<main class="login-page"><div class="login-card"><div class="login-brand"><span class="brand-icon">◈</span> CertWatch</div><p class="eyebrow">ADMINISTRATIONSZUGANG</p><h1>Willkommen zurück.</h1><p class="muted">Melden Sie sich an, um TLS-Zertifikate, Prüfintervalle und Vertrauensanker zu verwalten.</p>
{{if .Error}}<div class="alert error" role="alert">{{.Error}}</div>{{end}}
<form method="post" action="/login"><label for="username">Benutzername</label><input id="username" name="username" value="admin" required maxlength="40" autocomplete="username"><label for="password" class="password-label">Passwort</label><input id="password" type="password" name="password" minlength="1" required autofocus autocomplete="current-password"><button class="button primary full" type="submit">Anmelden →</button></form>
<p class="note">Erststart: Benutzer admin mit ADMIN_PASSWORD. Hinter einem HTTPS-Reverse-Proxy betreiben.</p></div></main>{{end}}
