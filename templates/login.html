{{define "login.html"}}<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmelden – {{.Title}}</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-bg"><main class="login-card"><div class="logo">✦</div><div class="eyebrow">UCNG / SYSTEM OPERATIONS</div><h1>Certificate Manager</h1><p class="muted">Zentrale ACME-Zertifikate, Formate und kontrollierte Verteilung.</p>{{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
<form method="post" action="/admin/login"><label>Benutzername<input type="text" name="username" value="{{.AdminUser}}" autocomplete="username" required></label><label>Passwort<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Sicher anmelden →</button></form></main></body></html>{{end}}
